<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goyaah architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #141414; }
  body { width: 1400px; }
  svg { display: block; }
  text { font-family: Archivo, system-ui, sans-serif; fill: #f2efe9; }
  .marker { font-family: 'Permanent Marker', Archivo, sans-serif; }
  .h { font-weight: 800; font-size: 30px; letter-spacing: -0.01em; }
  .t { font-weight: 600; font-size: 21px; }
  .s { font-weight: 400; font-size: 17px; fill: #9d9890; }
  .c { font-weight: 500; font-size: 17px; fill: #d6d2cb; }
  .k { font-weight: 500; font-size: 16px; fill: #141414; }
  .row { font-weight: 600; font-size: 18px; fill: #d6d2cb; }
  .box { fill: #1c1c1c; stroke: #5a5955; stroke-width: 1.5; }
  .big { fill: #181818; stroke: #6b6a66; stroke-width: 1.5; }
  .band { fill: #242424; stroke: #4a4946; stroke-width: 1.2; }
  .band.on { fill: #ff5a36; stroke: #ff5a36; }
  .band.user { fill: #2a2a2a; stroke: #5a5955; }
  .line { stroke: #d6d2cb; stroke-width: 1.6; fill: none; }
  .dash { stroke: #9d9890; stroke-width: 1.4; fill: none; stroke-dasharray: 5 5; }
  .brace { stroke: #6b6a66; stroke-width: 1.4; fill: none; }
  .sticker { fill: #f2efe9; }
  .accent { fill: #ff5a36; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#d6d2cb"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9d9890"/>
    </marker>
    <pattern id="wave" width="14" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20q3.5-9 7 0t7 0" fill="none" stroke="#9d9890" stroke-width="1.4"/>
    </pattern>
    <pattern id="voice" width="6" height="40" patternUnits="userSpaceOnUse">
      <rect x="2" y="12" width="2" height="16" fill="#d6d2cb"/>
    </pattern>
    <pattern id="voice2" width="6" height="40" patternUnits="userSpaceOnUse">
      <rect x="2" y="8" width="2" height="24" fill="#d6d2cb"/>
    </pattern>
    <pattern id="gen" width="6" height="40" patternUnits="userSpaceOnUse">
      <rect x="2" y="6" width="2" height="28" fill="#141414" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- header -->
  <g transform="translate(60 34)">
    <g transform="rotate(-4 26 26)"><path fill="#f2efe9" transform="translate(1.6 46.5) scale(0.0683 -0.0683)" d="M709 180Q685 137 646.0 113.5Q607 90 560.0 74.5Q513 59 461.5 47.0Q410 35 362 16Q348 16 337.5 15.0Q327 14 317.5 12.5Q308 11 299.0 9.5Q290 8 279 7Q275 8 274.0 5.5Q273 3 271 1Q254 -2 240.5 -2.0Q227 -2 218 -2Q206 -2 193.5 -5.5Q181 -9 171 -8Q96 -4 53.5 45.5Q11 95 6 183Q7 188 4.5 189.0Q2 190 0 192Q0 202 2.5 209.0Q5 216 3 227Q29 282 62.0 329.5Q95 377 141 413Q148 419 153.0 425.0Q158 431 162.5 437.0Q167 443 173.0 447.5Q179 452 188 454Q209 478 238.0 498.0Q267 518 299.0 536.5Q331 555 362.5 573.5Q394 592 420 615Q431 610 436.0 612.0Q441 614 447 612Q454 597 466.5 591.0Q479 585 491.5 578.5Q504 572 515.0 563.0Q526 554 532 539Q526 539 526.5 534.5Q527 530 529.0 525.5Q531 521 530.5 516.5Q530 512 523 512Q524 507 529.5 506.5Q535 506 535 501Q535 496 532.5 493.0Q530 490 532 483Q512 470 487.5 458.0Q463 446 436.5 432.5Q410 419 381.5 403.5Q353 388 326 368Q299 348 271.0 323.5Q243 299 217.0 272.0Q191 245 168.0 216.5Q145 188 129 160Q131 155 133.5 152.5Q136 150 138 145Q170 143 197.5 145.5Q225 148 253 142Q256 144 257.0 148.0Q258 152 262 154Q319 160 368.0 172.5Q417 185 468 199Q460 202 453.5 204.5Q447 207 441 209Q436 214 441.5 217.5Q447 221 451 225Q437 233 428.5 245.0Q420 257 418 277Q424 282 424.0 289.0Q424 296 418 300Q414 301 413.0 300.0Q412 299 411.5 297.0Q411 295 410.0 293.5Q409 292 405 294Q406 303 409.5 309.0Q413 315 415 323L484 369Q495 361 511.0 351.5Q527 342 544.5 332.5Q562 323 580.5 313.5Q599 304 615 295Q629 289 640.0 279.0Q651 269 661.0 258.5Q671 248 681.5 238.0Q692 228 706 221Q704 208 707.0 200.0Q710 192 709 180Z"/></g>
    <text class="marker" x="72" y="46" font-size="42">goyaah</text>
  </g>
  <text class="s" x="1340" y="64" text-anchor="end">How a call runs. PersonaPlex 7B on MLX, Apple Silicon.</text>

  <!-- ===== section 1: every 80 ms ===== -->
  <text class="h" x="60" y="150">Every 80 ms, for the whole call</text>
  <text class="s" x="60" y="180">One model step per frame. Audio goes in and comes out at the same time, so there are no turns.</text>

  <!-- mic -->
  <rect class="box" x="60" y="320" width="150" height="86" rx="10"/>
  <text class="t" x="135" y="356" text-anchor="middle">Your mic</text>
  <text class="s" x="135" y="382" text-anchor="middle">24 kHz, browser</text>

  <!-- mimi encoder -->
  <rect class="box" x="258" y="320" width="186" height="86" rx="10"/>
  <text class="t" x="351" y="356" text-anchor="middle">Mimi encoder</text>
  <text class="s" x="351" y="382" text-anchor="middle">80 ms → 8 codes</text>

  <!-- model -->
  <rect class="big" x="492" y="222" width="420" height="300" rx="14"/>
  <text class="t" x="702" y="256" text-anchor="middle">PersonaPlex 7B · MLX, 4-bit</text>

  <rect class="box" x="516" y="276" width="372" height="92" rx="10"/>
  <text class="t" x="702" y="310" text-anchor="middle">Temporal Transformer</text>
  <text class="s" x="702" y="336" text-anchor="middle">32 layers, 4096 wide, 3000-frame ring cache</text>

  <path class="line" d="M702 368v22" marker-end="url(#a)"/>

  <rect class="box" x="516" y="396" width="372" height="92" rx="10"/>
  <text class="t" x="702" y="430" text-anchor="middle">Depth Transformer</text>
  <text class="s" x="702" y="456" text-anchor="middle">6 layers, 1 text token then 8 agent codes</text>

  <text class="s" x="702" y="510" text-anchor="middle">only the agent's codebooks are sampled, not the user's</text>

  <!-- in / out labels -->
  <text class="c" x="444" y="248" text-anchor="end">in, per frame</text>
  <text class="s" x="444" y="272" text-anchor="end">8 user codes + 8 agent codes</text>
  <text class="s" x="444" y="294" text-anchor="end">+ 1 text token</text>

  <text class="c" x="936" y="286">out, per frame</text>
  <text class="s" x="936" y="310">1 text token</text>
  <text class="s" x="936" y="332">8 agent codes</text>

  <!-- arrows along the main row -->
  <path class="line" d="M210 363h40" marker-end="url(#a)"/>
  <path class="line" d="M444 363h40" marker-end="url(#a)"/>
  <path class="line" d="M912 442h86" marker-end="url(#a)"/>

  <!-- mimi decoder -->
  <rect class="box" x="1006" y="399" width="186" height="86" rx="10"/>
  <text class="t" x="1099" y="435" text-anchor="middle">Mimi decoder</text>
  <text class="s" x="1099" y="461" text-anchor="middle">8 codes → 80 ms</text>

  <!-- speaker -->
  <path class="line" d="M1192 442h40" marker-end="url(#a)"/>
  <rect class="box" x="1240" y="399" width="110" height="86" rx="10"/>
  <text class="t" x="1295" y="435" text-anchor="middle">Speaker</text>
  <text class="s" x="1295" y="461" text-anchor="middle">headphones</text>

  <!-- feedback: agent codes back into next frame -->
  <path class="dash" d="M702 522v30H466V363h18" marker-end="url(#ad)"/>
  <text class="s" x="715" y="574" text-anchor="middle">the agent's own codes come back in as input for the next frame</text>

  <!-- text stream down to chat -->
  <path class="line" d="M912 410h60v-60h88" marker-end="url(#a)"/>
  <rect class="box" x="1066" y="286" width="284" height="110" rx="10"/>
  <text class="t" x="1208" y="318" text-anchor="middle">Chat view</text>
  <text class="s" x="1208" y="343" text-anchor="middle">agent's words: the text stream,</text>
  <text class="s" x="1208" y="364" text-anchor="middle">one token per frame</text>
  <text class="s" x="1208" y="386" text-anchor="middle">your words: Whisper on the CPU</text>

  <!-- stickers -->
  <g transform="translate(60 440) rotate(-3)">
    <rect class="sticker" x="0" y="0" width="172" height="34" rx="4"/>
    <text class="k marker" x="86" y="23" text-anchor="middle">80 ms in, 80 ms out</text>
  </g>
  <g transform="translate(250 452) rotate(2)">
    <rect class="sticker" x="0" y="0" width="200" height="34" rx="4"/>
    <text class="k marker" x="100" y="23" text-anchor="middle">26 ms on an M4 Pro</text>
  </g>
  <text class="s" x="60" y="530">Latency budget: a frame must finish in under 80 ms.</text>
  <text class="s" x="60" y="554">4-bit weights take 7 GB; 8-bit takes 10 GB at 38 ms.</text>

  <!-- ===== section 2: the prompt ===== -->
  <text class="h" x="60" y="660">Before the call: the hybrid prompt</text>
  <text class="s" x="60" y="690">Three token streams at 12.5 Hz. The persona is a voice sample plus a text prompt, pushed through the model before you speak.</text>

  <!-- row labels -->
  <text class="row" x="60" y="757">User audio</text>
  <text class="row" x="60" y="817">Agent text</text>
  <text class="row" x="60" y="877">Agent audio</text>

  <!-- columns: x positions -->
  <!-- voice 210..440, pause 452..562, text 574..904, pause 916..1026, gen 1038..1350 -->

  <!-- user audio row (y 730) -->
  <rect class="band user" x="210" y="730" width="230" height="44" rx="8"/><rect x="214" y="732" width="222" height="40" rx="6" fill="url(#wave)"/>
  <rect class="band user" x="452" y="730" width="110" height="44" rx="8"/><rect x="456" y="732" width="102" height="40" rx="6" fill="url(#wave)"/>
  <rect class="band user" x="574" y="730" width="330" height="44" rx="8"/><rect x="578" y="732" width="322" height="40" rx="6" fill="url(#wave)"/>
  <rect class="band user" x="916" y="730" width="110" height="44" rx="8"/><rect x="920" y="732" width="102" height="40" rx="6" fill="url(#wave)"/>
  <rect class="band user" x="1038" y="730" width="312" height="44" rx="8"/><rect x="1042" y="732" width="304" height="40" rx="6" fill="url(#voice)"/>
  <text class="s" x="1194" y="759" text-anchor="middle" style="paint-order:stroke;stroke:#2a2a2a;stroke-width:8px">your mic</text>

  <!-- agent text row (y 790) -->
  <rect class="band" x="210" y="790" width="230" height="44" rx="8"/><text class="c" x="325" y="819" text-anchor="middle">PAD … PAD</text>
  <rect class="band" x="452" y="790" width="110" height="44" rx="8"/><text class="c" x="507" y="819" text-anchor="middle">PAD</text>
  <rect class="band" x="574" y="790" width="330" height="44" rx="8"/><text class="c" x="739" y="819" text-anchor="middle">&lt;system&gt; You are Jess, a … &lt;system&gt;</text>
  <rect class="band" x="916" y="790" width="110" height="44" rx="8"/><text class="c" x="971" y="819" text-anchor="middle">PAD</text>
  <rect class="band" x="1038" y="790" width="312" height="44" rx="8"/><text class="c" x="1194" y="819" text-anchor="middle">Hey  PAD  so  PAD  PAD  what …</text>

  <!-- agent audio row (y 850) -->
  <rect class="band" x="210" y="850" width="230" height="44" rx="8"/><rect x="214" y="852" width="222" height="40" rx="6" fill="url(#voice2)"/>
  <text class="c" x="325" y="879" text-anchor="middle" style="paint-order:stroke;stroke:#242424;stroke-width:8px">voice sample</text>
  <rect class="band" x="452" y="850" width="110" height="44" rx="8"/><line x1="470" y1="872" x2="544" y2="872" stroke="#6b6a66" stroke-width="1.6"/>
  <rect class="band" x="574" y="850" width="330" height="44" rx="8"/><line x1="592" y1="872" x2="886" y2="872" stroke="#6b6a66" stroke-width="1.6"/>
  <rect class="band" x="916" y="850" width="110" height="44" rx="8"/><line x1="934" y1="872" x2="1008" y2="872" stroke="#6b6a66" stroke-width="1.6"/>
  <rect class="band on" x="1038" y="850" width="312" height="44" rx="8"/><rect x="1042" y="852" width="304" height="40" rx="6" fill="url(#gen)"/>
  <text class="c" x="1194" y="879" text-anchor="middle" style="fill:#141414;font-weight:600;paint-order:stroke;stroke:#ff5a36;stroke-width:8px">generated, to the speaker</text>

  <!-- braces under -->
  <path class="brace" d="M210 912v10h230v-10"/><text class="s" x="325" y="946" text-anchor="middle">voice prompt</text>
  <path class="brace" d="M452 912v10h110v-10"/><text class="s" x="507" y="946" text-anchor="middle">0.5 s silence</text>
  <path class="brace" d="M574 912v10h330v-10"/><text class="s" x="739" y="946" text-anchor="middle">text prompt</text>
  <path class="brace" d="M916 912v10h110v-10"/><text class="s" x="971" y="946" text-anchor="middle">0.5 s silence</text>
  <path class="brace" d="M1038 912v10h312v-10"/><text class="s" x="1194" y="946" text-anchor="middle">the call, one step per 80 ms</text>

  <path class="brace" d="M210 966v10h816v-10"/>
  <text class="c" x="560" y="1000" text-anchor="middle">system prompt: nothing is sampled here, so Goyaah prefills it in two batched passes</text>
  <g transform="translate(910 978) rotate(-2)">
    <rect class="sticker" x="0" y="0" width="118" height="30" rx="4"/>
    <text class="k marker" x="59" y="21" text-anchor="middle">1.1 s, not 6.7 s</text>
  </g>

  <text class="s" x="1340" y="1040" text-anchor="end">Model: NVIDIA PersonaPlex 7B, fine-tuned from Kyutai Moshi. Codec: Kyutai Mimi. Port: Goyaah, MIT.</text>
</svg>
</body>
</html>
